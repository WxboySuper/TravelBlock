name: Build installable APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Builds queue up behind each other instead of cancelling.
concurrency:
  group: apk-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon -PbuildNumber=${{ github.run_number }} -PbuildSha=${{ github.sha }}

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TravelBlock.apk

      - name: Publish to the "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          SHORT=$(git rev-parse --short HEAD)
          PUBLISHED=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          FIRST_LINE="build=${BUILD_NUMBER} sha=${SHORT} published=${PUBLISHED}"
          SECOND_LINE="Build of commit ${SHORT}. Open this page on your phone and tap TravelBlock.apk to install."
          printf '%s\n%s\n' "$FIRST_LINE" "$SECOND_LINE" > release-notes.txt
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest TravelBlock.apk \
            --title "TravelBlock latest build" \
            --notes-file release-notes.txt \
            --prerelease --target "$GITHUB_SHA"
